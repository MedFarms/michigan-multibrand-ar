# .github/workflows/nightly-full-refresh.yml
# Drop this into the michigan-multibrand-ar repo ALONGSIDE the existing every-15-min
# scrape workflow. It runs ONE full (non-incremental) pull per day so that any order
# whose payment was missed by the incremental passes is fully reconciled nightly.
# This is the safety net behind the in-scraper modified-refresh fix.

name: Nightly full AR refresh

on:
  schedule:
    - cron: '23 8 * * *'      # 08:23 UTC daily (~3:23am ET) — off-peak, odd minute
  workflow_dispatch:           # lets you run it on demand from the Actions tab

permissions:
  contents: write

# IMPORTANT: use the SAME concurrency group name as your existing 15-min scrape
# workflow, so the nightly full pull and a scheduled incremental run can never
# execute at the same time (they both commit sales_data.json.gz and would collide).
concurrency:
  group: scrape-ar
  cancel-in-progress: false

jobs:
  full-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper (forced FULL pull)
        env:
          # Forces a full, non-incremental pull regardless of LEAFLINK_INCREMENTAL_DAYS,
          # so paid orders are fully cleared from the AR feed once a day.
          LEAFLINK_FORCE_FULL: '1'
          # --- Copy the SAME env block your existing scrape workflow passes ---
          # (API key + every LEAFLINK_* var it sets), e.g.:
          LEAFLINK_API_KEY: ${{ secrets.LEAFLINK_API_KEY }}
          # LEAFLINK_FROM_DATE: '2025-01-01'
          # LEAFLINK_SELLER_ID: '9105'
          # LEAFLINK_AR_UNPAID_ONLY: '1'
          # ...anything else the existing AR workflow sets...
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The every-15-min scrape job can push to main while this ~9-min full pull
          # is running, which makes a plain `git push` fail with "(fetch first)".
          # Retry loop: on each attempt, reset to the latest remote main, lay OUR
          # freshly generated file on top, commit, and push. The full refresh is the
          # authoritative version, so "ours wins" is the correct policy here; the next
          # incremental run re-adds any brand-new orders 15 min later.
          cp sales_data.json.gz /tmp/ours.gz
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ours.gz sales_data.json.gz
            git add sales_data.json.gz
            if git diff --staged --quiet; then
              echo "No change vs remote — nothing to commit."; exit 0
            fi
            git commit -m "Nightly full AR refresh [skip ci]"
            if git push; then
              echo "Pushed on attempt $i."; exit 0
            fi
            echo "Push rejected (remote moved); retrying ($i/5)…"
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "ERROR: could not push after 5 attempts."; exit 1
